name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'vocab-server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'vocab-server'
          target: '/opt/QuickABC'
          strip_components: 0
          overwrite: true
          rm: false

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/QuickABC/vocab-server && npm install --omit=dev && (pm2 restart vocab-server || pm2 start src/server.js --name vocab-server) && pm2 save && sleep 2 && curl -s http://127.0.0.1:3001/health
